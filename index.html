<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arkeoloji Mini Testi</title><style>body{margin:0;font-family:Arial;background:#f5ead8;color:#3d281b}.wrap{max-width:700px;margin:auto;padding:18px}.card{background:#fffdf8;border-radius:20px;overflow:hidden;box-shadow:0 8px 30px #0002}.head{background:#643a23;color:#fff;text-align:center;padding:28px}.head h1{font-family:Georgia;margin:0}.q{padding:25px}.opt{display:block;width:100%;padding:15px;margin:10px 0;border:2px solid #eadbc4;border-radius:12px;background:#fffaf2;text-align:left;font-size:16px}.opt.sel{background:#f0ddc2;border-color:#754326}.next{float:right;background:#643a23;color:#fff;border:0;padding:13px 22px;border-radius:10px;font-weight:bold}.clear{clear:both}.score{text-align:center;padding:35px;font-size:20px}.score b{font-size:58px;color:#754326}.links a{display:block;margin:12px 0;padding:15px;border-radius:10px;text-decoration:none;text-align:center;font-weight:bold;background:#643a23;color:#fff}</style></head><body><div class="wrap"><div class="card" id="app"></div></div><script>const qs=[['Göbeklitepe hangi ilimizdedir?',['Şanlıurfa','Mardin','Van','Antalya'],0],['Kazı tabakalarını inceleyen yöntem nedir?',['Stratigrafi','Numismatik','Epigrafi','Paleografi'],0],['Karahantepe hangi proje/arkeolojik bölge içinde öne çıkar?',['Taş Tepeler','Roma Yolu','Urartu Kuşağı','İyon Birliği'],0],['Harran’ın geleneksel konik kubbeli evleri neyle tanınır?',['Kümbet evler','Yalılar','Han evleri','Kaya evleri'],0],['Bir buluntunun bulunduğu konum neden kaydedilir?',['Bağlamını anlamak için','Satış fiyatı için','Rengini değiştirmek için','Sadece fotoğraf için'],0],['Seramik parçaları ne hakkında bilgi verebilir?',['Dönem ve kullanım','Hava durumu','Kişinin boyu','Deprem şiddeti'],0],['Arkeolojinin temel amacı nedir?',['Geçmiş toplumları maddi kalıntılarla anlamak','Eski eşyaları satmak','Buluntuları saklamak','Sadece fotoğraf çekmek'],0],['Arkeoloji ile definecilik arasındaki önemli fark nedir?',['Arkeoloji bilimsel yöntem ve kayıtla çalışır','İkisi aynıdır','Definecilik bilimsel rapor üretir','Arkeoloji buluntuları satar'],0],['Buluntunun belgelenmesi neden önemlidir?',['Bilimsel kayıt ve koruma için','Daha pahalı satmak için','Rengini değiştirmek için','Fotoğrafı silmek için'],0],['Şanlıurfa arkeolojisini takip etmek isteyen biri için hangisi uygundur?',['Harran Üniversitesi Arkeoloji Kulübü','Sadece sosyal medya reklamları','Define ilanları','Belgesiz kazılar'],0]];let i=0,s=0,sel=null;const app=document.getElementById('app');function draw(){sel=null;let x=qs[i];app.innerHTML='<div class="head"><div style="font-size:42px">🏺</div><h1>ARKEOLOJİ MİNİ TESTİ</h1><p>Harran Üniversitesi Arkeoloji Kulübü</p></div><div class="q"><small>SORU '+(i+1)+' / 10</small><h2>'+x[0]+'</h2><div id="opts"></div><button class="next" id="next" disabled>Sonraki →</button><div class="clear"></div></div>';x[1].forEach((v,j)=>{let b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>{sel=j;document.querySelectorAll('.opt').forEach(z=>z.classList.remove('sel'));b.classList.add('sel');document.getElementById('next').disabled=false};document.getElementById('opts').appendChild(b)});document.getElementById('next').onclick=()=>{if(sel===x[2])s++;i++;i<qs.length?draw():finish()}}function finish(){let t=s>=8?'🏆 ARKEOLOJİ DEDEKTİFİ':s>=5?'🔎 GENÇ ARAŞTIRMACI':'🏺 ARKEOLOJİ MERAKLISI';app.innerHTML='<div class="score"><h1>TEST TAMAMLANDI!</h1><b>'+s+'/10</b><h2>'+t+'</h2><p>Arkeoloji dünyasını keşfetmeye devam et!</p><div class="links"><a href="https://www.instagram.com/hruarkeolojikulubu/" target="_blank">📱 @hruarkeolojikulubu — Bizi Takip Et</a><a href="https://www.instagram.com/hruarkeolojikulubu/" target="_blank">🏛️ Harran Üniversitesi Arkeoloji Kulübü</a></div></div>'}draw();</script></body></html>

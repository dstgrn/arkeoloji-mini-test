<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arkeoloji Mini Testi | Harran Üniversitesi Arkeoloji Kulübü</title>
<style>
:root{
 --brown:#5b321e;--brown2:#7b4527;--gold:#b88952;--cream:#f7efdf;
 --paper:#fffdf8;--line:#e2cfb0;--text:#35251b;
}
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;color:var(--text);
 font-family:Arial,Helvetica,sans-serif;
 background:
 radial-gradient(circle at 15% 10%,rgba(184,137,82,.14),transparent 28%),
 radial-gradient(circle at 90% 90%,rgba(123,69,39,.12),transparent 30%),
 linear-gradient(135deg,#efe2cc,#fffaf2 55%,#eee0c8);
}
.container{width:min(760px,100%);margin:auto;padding:18px 14px 44px}
.card{
 background:var(--paper);border:1px solid var(--line);border-radius:24px;
 box-shadow:0 14px 45px rgba(73,43,24,.15);overflow:hidden;
}
.header{
 padding:22px 18px 24px;text-align:center;
 background:linear-gradient(135deg,#4f2d1b,#7b4527);color:white;
}
.logos{display:flex;justify-content:center;align-items:center;gap:22px;margin-bottom:12px}
.logo{width:86px;height:86px;border-radius:50%;object-fit:contain;background:white;padding:4px;box-shadow:0 3px 14px rgba(0,0,0,.18)}
.header h1{font-family:Georgia,serif;font-size:28px;line-height:1.15;margin:4px 0}
.header p{margin:7px 0 0;opacity:.9;font-size:14px}
.progress{height:8px;background:#eadbc4}
.progress-bar{height:100%;width:0;background:#c79758;transition:.3s}
.question{padding:27px 24px 10px}
.number{font-size:13px;color:#9b6a38;font-weight:800;letter-spacing:.08em}
h2{font-family:Georgia,serif;font-size:22px;line-height:1.4;margin:10px 0 22px}
.options{display:grid;gap:11px}
.option{
 width:100%;border:2px solid #eadbc4;background:#fffaf2;color:var(--text);
 padding:15px 16px;border-radius:13px;text-align:left;font-size:16px;
 cursor:pointer;transition:.18s;
}
.option:hover{border-color:#b88952;transform:translateY(-1px)}
.option.selected{border-color:var(--brown2);background:#f1e1cd}
.option .letter{font-weight:800;color:var(--brown2);margin-right:8px}
.footer{padding:14px 24px 28px;display:flex}
button.next{
 border:0;border-radius:12px;padding:14px 23px;background:var(--brown2);
 color:white;font-weight:800;font-size:15px;cursor:pointer;margin-left:auto;
}
button.next:disabled{opacity:.4;cursor:not-allowed}
.result{text-align:center;padding:36px 24px 40px}
.result-logo{width:90px;height:90px;object-fit:contain;border-radius:50%;margin-bottom:8px}
.result h1{font-family:Georgia,serif;margin:5px 0 18px}
.score{font-size:62px;font-weight:900;color:var(--brown2)}
.badge{font-family:Georgia,serif;font-size:25px;margin:8px 0 17px}
.result p{font-size:16px;line-height:1.6}
.actions{display:grid;gap:11px;margin-top:24px}
.actions a{display:block;text-decoration:none;padding:15px;border-radius:12px;font-weight:800}
.instagram{background:#ead7bd;color:#4d2b1c}
.retry{background:var(--brown2);color:white}
.small{font-size:12px;color:#8b725e;margin-top:20px}
@media(max-width:520px){
 .container{padding:8px 8px 28px}.header{padding:18px 14px 20px}
 .logo{width:70px;height:70px}.logos{gap:14px}
 .header h1{font-size:23px}.question{padding:23px 17px 8px}
 h2{font-size:20px}.footer{padding:12px 17px 23px}
 .option{font-size:15px}
}
</style>
</head>
<body>
<div class="container">
<div class="card" id="app">
  <div class="header">
    <div class="logos">
      <img class="logo" src="universite-logo.jpg" alt="Harran Üniversitesi logosu">
      <img class="logo" src="kulup-logo.jpeg" alt="Harran Üniversitesi Arkeoloji Kulübü logosu">
    </div>
    <h1>ARKEOLOJİ MİNİ TESTİ</h1>
    <p>Harran Üniversitesi Arkeoloji Kulübü</p>
  </div>
  <div class="progress"><div class="progress-bar" id="bar"></div></div>
  <div class="question">
    <div class="number" id="number"></div>
    <h2 id="question"></h2>
    <div class="options" id="options"></div>
  </div>
  <div class="footer">
    <button class="next" id="next" disabled>Sonraki →</button>
  </div>
</div>
</div>

<script>
const questions=[
 {q:"Aşağıdaki hayvanlardan hangisi Göbeklitepe’deki taşların üzerinde en çok tasvir edilen (en sık görülen) hayvanlardan biridir?",
  o:["At","Yılan","Yaban domuzu","Fil"],a:"Yaban domuzu"},
 {q:"Kazı alanlarında en eski katmandan en yeni katmana doğru yapılan kronolojik sıralama ve inceleme yaklaşımına ne ad verilir?",
  o:["Epigrafi","Stratigrafi","Numismatik","Tipoloji"],a:"Stratigrafi"},
 {q:"Göbeklitepe, Karahantepe, Sayburç gibi Neolitik yerleşimler hangi geniş arkeolojik ve kültürel proje kapsamında değerlendirilmektedir?",
  o:["Taş Tepeler","Hitit Projesi","Mezopotamya Kentleri Projesi","Anadolu Tunç Çağı Projesi"],a:"Taş Tepeler"},
 {q:"Hitit İmparatorluğu'nun başkenti olan ve günümüzde Çorum sınırları içinde yer alan antik kent hangisidir?",
  o:["Gordion","Alacahöyük","Hattuşa","Sardes"],a:"Hattuşa"},
 {q:"Şanlıurfa Müzesi'nde sergilenen ve “Dünyanın gerçek boyutlu ilk insan heykeli” olarak kabul edilen ünlü eser aşağıdakilerden hangisidir?",
  o:["Urfa Adamı","İskender Lahdi","Naram-Sin Steli","Hitit Güneş Kursu"],a:"Urfa Adamı"},
 {q:"Yunan mitolojisinde tanrıların kralı olan, şimşekleri ve yıldırımları yöneten en güçlü tanrı hangisidir?",
  o:["Ares","Poseidon","Zeus","Apollon"],a:"Zeus"},
 {q:"Aşk ve güzellik tanrıçası olan, aynı zamanda ismini gökyüzündeki en parlak gezegenlerden birine veren tanrıça hangisidir?",
  o:["Athena","Artemis","Hera","Afrodit"],a:"Afrodit"},
 {q:"Dünyanın en eski destanlarından biri olan, ölümsüzlüğü arayan Uruk Kralı'nın maceralarını anlatan ünlü Mezopotamya destanı hangisidir?",
  o:["Gılgamış Destanı","İlyada","Odysseia","Enuma Eliş"],a:"Gılgamış Destanı"},
 {q:"Troya Savaşı'nın çıkış nedeni olan, üzerinde “En Güzele” yazan altın elmayı aşk tanrıçası Afrodit'e vererek tarihin en büyük savaşlarından birini başlatan Truvalı prens kimdir?",
  o:["Hektor","Paris","Aeneas","Priamos"],a:"Paris"},
 {q:"Efsaneye göre, cüzam hastalığına yakalanan Urfa Kralı V. Abgar, İsa Peygamber'in mucizelerini duyar ve ona kendisini iyileştirmesi için bir mektup yollar. İsa Peygamber gelemez ancak yüzünü sildiği bir mendili elçiye verir. Mendilde İsa'nın yüzünün mucizevi bir resmi oluşur ve bu mendil Urfa'ya ulaşınca kral iyileşir. Hristiyan dünyasında “insan eliyle yapılmamış ilk ikon” olarak kabul edilen ve yüzyıllarca Şanlıurfa'da saklanan bu kutsal mendile arkeoloji ve sanat tarihinde ne ad verilir?",
  o:["Mandylion","Veronica Mendili","Turin Kefeni","Kutsal Peçe"],a:"Mandylion"}
];

let current=0,score=0,selected=null;
const qEl=document.getElementById("question"),oEl=document.getElementById("options");
const nEl=document.getElementById("number"),next=document.getElementById("next"),bar=document.getElementById("bar");

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function render(){
 selected=null;next.disabled=true;
 const x=questions[current];
 nEl.textContent=`SORU ${current+1} / ${questions.length}`;
 qEl.textContent=x.q;
 oEl.innerHTML="";
 const shuffled=shuffle(x.o);
 shuffled.forEach((text,i)=>{
   const b=document.createElement("button");
   b.className="option";
   const letter=String.fromCharCode(65+i);
   b.innerHTML=`<span class="letter">${letter})</span>${text}`;
   b.onclick=()=>{
     selected=text;
     document.querySelectorAll(".option").forEach(v=>v.classList.remove("selected"));
     b.classList.add("selected");next.disabled=false;
   };
   oEl.appendChild(b);
 });
 bar.style.width=((current)/questions.length*100)+"%";
}
next.onclick=()=>{
 if(selected===questions[current].a) score++;
 current++;
 if(current<questions.length) render(); else finish();
};
function finish(){
 bar.style.width="100%";
 let title,desc;
 if(score<=4){title="ARKEOLOJİ MERAKLISI 🏺";desc="İyi bir başlangıç! Arkeoloji dünyasını keşfetmeye devam et."}
 else if(score<=7){title="GENÇ ARAŞTIRMACI 🔎";desc="Arkeolojiye ilgin oldukça iyi. Biraz daha keşif seni bekliyor!"}
 else{title="ARKEOLOJİ DEDEKTİFİ 🏆";desc="Harika! Arkeoloji bilgin gerçekten güçlü."}
 document.getElementById("app").innerHTML=`
  <div class="result">
    <img class="result-logo" src="kulup-logo.jpeg" alt="Arkeoloji Kulübü logosu">
    <h1>TEST TAMAMLANDI!</h1>
    <div class="score">${score}/10</div>
    <div class="badge">${title}</div>
    <p>${desc}</p>
    <p>Arkeoloji dünyasını takip etmek ve kulüp çalışmalarından haberdar olmak ister misin?</p>
    <div class="actions">
      <a class="instagram" href="https://www.instagram.com/hruarkeolojikulubu/" target="_blank" rel="noopener">📱 @hruarkeolojikulubu — Bizi Takip Et</a>
      <a class="retry" href="#" onclick="location.reload();return false;">🔄 Testi Tekrar Çöz</a>
    </div>
    <div class="small">Harran Üniversitesi Arkeoloji Kulübü</div>
  </div>`;
}
render();
</script>
</body>
</html>
